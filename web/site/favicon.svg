<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Theme-adaptive tile: cream on dark chrome, dark on light chrome.
       The base rule is the dark tile, so light chrome and no-preference
       browsers match the site's dark-by-default pages. The triangle
       colors are theme-independent. Static PNG fallbacks for browsers
       without SVG-favicon support are rendered by web/make_favicon.py
       from the same geometry. -->
  <style>
    .tile { fill: #181a1b; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f6f3ec; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7" />
  <path d="M8 8 L14.75 19.5 H1.25 Z" fill="#00BD00" />
  <path d="M23.25 24 L16.5 12.5 H30 Z" fill="#BD0000" />
</svg>
